plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

// One VERSION file at the repo root drives both loaders (e.g. 1.2.0-alpha, 1.2.0-beta, 1.2.0).
def base_version = file('../VERSION').text.trim()
// A released build carries its build number (ROC_BUILD, set by the workflow): 1.2.0-alpha.57. The file name and the
// version the game shows are then different for every build, so an old copy can never pass for a new one.
def build = System.getenv('ROC_BUILD') ?: ''
def mod_version = build && base_version.contains('-') ? "${base_version}.${build}" : base_version
version = "${build && !base_version.contains('-') ? base_version + '.' + build : mod_version}+mc${minecraft_version}"
group = 'com.thefarawaydev.realmsofchaos'
base { archivesName = 'realms-of-chaos-forge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Shared (loader independent) sources and resources live in ../common (client code is merged into main on Forge)
sourceSets.main {
    java.srcDir '../common/src/main/java'
    java.srcDir '../common/src/client/java'
    resources.srcDir '../common/src/main/resources'
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client')
        register('server') {
            args '--nogui'
        }
        // Headless smoke test: Forge's game-test server with the mod's built-in self-test switched on.
        register('gameTestServer') {
            systemProperty 'roc.selftest', 'true'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [mod_id: mod_id, mod_version: mod_version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'Realms of Chaos',
            'Specification-Vendor'  : 'TheFarawayDev',
            'Implementation-Title'  : 'Realms of Chaos',
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : 'TheFarawayDev'
        ])
    }
    from('../LICENSE') { rename { "${it}_realms_of_chaos" } }
}
