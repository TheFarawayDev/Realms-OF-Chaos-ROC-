plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// One VERSION file at the repo root drives both loaders (e.g. 1.2.0-alpha, 1.2.0-beta, 1.2.0).
def modVersion = file('../VERSION').text.trim()
// A released build carries its build number (ROC_BUILD, set by the workflow): 1.2.0-alpha.57. The file name and the
// version the game shows are then different for every build, so an old copy can never pass for a new one.
def build = System.getenv('ROC_BUILD') ?: ''
def stamped = build && modVersion.contains('-') ? "${modVersion}.${build}" : modVersion
version = "${build && !modVersion.contains('-') ? modVersion + '.' + build : stamped}+mc${project.minecraft_version}"
group = 'com.thefarawaydev.realmsofchaos'
base { archivesName = 'realms-of-chaos-fabric' }

loom {
	splitEnvironmentSourceSets()
	mods {
		"realms_of_chaos" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Shared (loader independent) sources and resources live in ../common
sourceSets {
	main {
		java.srcDir '../common/src/main/java'
		resources.srcDir '../common/src/main/resources'
	}
	client {
		java.srcDir '../common/src/client/java'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = stamped
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("../LICENSE") { rename { "${it}_realms_of_chaos" } }
}
