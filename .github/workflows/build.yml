name: Build Realms of Chaos

on:
  push:
    branches: [master]   # other branches (mirrors, work in progress) are not built; pull requests still are
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Forge's tooling needs a JDK 8 on the machine; the mod itself builds with JDK 25.
      - name: Install JDK 8 (Forge tooling)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-8-jdk-headless

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Pillow (asset generator)
        run: python3 -m pip install pillow

      - name: Build Fabric + Forge and package the zip
        run: ./build.sh

      # Headless smoke test on a real Forge game-test server (the mod's built-in self-test). Reported, not blocking.
      - name: Self-test on a Forge test server
        continue-on-error: true
        run: |
          cd forge
          ./gradlew --no-daemon runGameTestServer
          cat run/roc-selftest.txt
          grep -q "ALL PASSED" run/roc-selftest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RealmsOfChaos-mc26.3
          path: dist/*.zip
          if-no-files-found: error

      # The VERSION file decides the channel: 1.2.0-alpha / 1.2.0-beta are published as pre-releases, 1.2.0 as a full release.
      - name: Read version
        id: ver
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          case "$V" in
            *alpha*) echo "channel=Alpha" >> "$GITHUB_OUTPUT"; echo "pre=true" >> "$GITHUB_OUTPUT" ;;
            *beta*)  echo "channel=Beta"  >> "$GITHUB_OUTPUT"; echo "pre=true" >> "$GITHUB_OUTPUT" ;;
            *)       echo "channel=Release" >> "$GITHUB_OUTPUT"; echo "pre=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Every push to master publishes a GitHub release with the Fabric and Forge jars.
      - name: Publish release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}.${{ github.run_number }}
          name: Realms of Chaos ${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.channel }}, build ${{ github.run_number }})
          prerelease: ${{ steps.ver.outputs.pre }}
          body: |
            Realms of Chaos by TheFarawayDev for Minecraft 26.3 (Fabric and Forge).
            Channel: ${{ steps.ver.outputs.channel }}. Download the jar for your loader: Fabric or Forge.
          files: |
            fabric/build/libs/realms-of-chaos-fabric-*[0-9].jar
            forge/build/libs/realms-of-chaos-forge-*[0-9].jar
