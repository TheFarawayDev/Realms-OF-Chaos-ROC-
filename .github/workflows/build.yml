name: Build Realms of Chaos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Forge's tooling needs a JDK 8 on the machine; the mod itself builds with JDK 25.
      - name: Install JDK 8 (Forge tooling)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-8-jdk-headless

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Pillow (asset generator)
        run: python3 -m pip install pillow

      - name: Build Fabric + Forge and package the zip
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RealmsOfChaos-mc26.3
          path: dist/*.zip
          if-no-files-found: error
